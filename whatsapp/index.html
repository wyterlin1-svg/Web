<meta charset="utf-8">

<title>Murinoi no WhatsApp</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f3ee;color:#2e2b33;font:17px/1.6 system-ui,-apple-system,sans-serif;text-align:center}
img{width:72px;height:72px}
a{color:#9b6f7d}
</style>

<body>
<main><img src="/favicon.svg" alt=""><p>Abrindo o WhatsApp da Murinoi…</p><p><a id="ir" href="/#contato">Toque aqui se não abrir</a></p></main>
<script>
// Leva direto para a conversa. Use ?texto=... para trocar a mensagem inicial.
const WA_K = 'IyIkJSUuLy4uJSUiIg==';
const q = new URLSearchParams(location.search);
const msg = q.get('texto') || q.get('text') || 'Olá! Vim pelo site da Murinoi.';
const url = 'https://wa.me/' + [...atob(WA_K)].map(c => String.fromCharCode(c.charCodeAt(0) ^ 23)).reverse().join('') + '?text=' + encodeURIComponent(msg);
document.getElementById('ir').href = url;
// registra o contato no Google Analytics antes de sair (no máximo 0,8 s de espera)
let foi = false;
const ir = () => { if (!foi) { foi = true; location.replace(url); } };
gtag('event', 'generate_lead', { method: 'whatsapp', origem: q.get('origem') || 'link', event_callback: ir });
setTimeout(ir, 800);
</script>
</body>
