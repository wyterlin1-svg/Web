# Site Murinoi — cole a URL deste arquivo no Docker Manager da Hostinger.
# Funciona sozinho nos dois casos:
#  - VPS já tem Traefik (ex.: n8n) -> o site entra atrás dele e copia a configuração de HTTPS dos outros apps.
#  - Portas livres -> o site usa 80/443 direto e o Caddy emite o HTTPS.
#  - Porta 80 ocupada por outro programa -> o site sobe na porta 8080 (veja o log).
# O site é baixado do GitHub (ramo "hostinger") e se atualiza a cada 10 minutos.
# Voz da Nina: a sua voz clonada (Chatterbox, na VPS) ou, sem ela, vozes neurais de mulher (pt-BR), em /voz, de graça e com cache.
# Chatbot do WhatsApp: Evolution API (só na rede interna) + n8n com IA. O código de conexão aparece no log.
# Antes: registros A de murinoi.com e www no DNS apontando para o IP da VPS.
services:
  instalador:
    image: docker:27-cli
    container_name: murinoi-instalador
    restart: unless-stopped
    environment:
      DOMINIOS: "murinoi.com www.murinoi.com"
      SITE_ZIP: "https://github.com/wyterlin1-svg/Web/archive/refs/heads/hostinger.zip"
      # chatbot do WhatsApp: Evolution API conversa, o n8n (IA) responde
      EVOLUTION: "sim"
      N8N_WEBHOOK: "https://murinoi.app.n8n.cloud/webhook/murinoi-bot-k7q2x9"
      BOT_GATILHO: "pelo site"
      # voz da Nina no site (pt-BR-ThalitaMultilingualNeural ou pt-BR-FranciscaNeural)
      VOZ_NOME: "pt-BR-ThalitaMultilingualNeural"
      # voz clonada (a sua voz, gravada em murinoi.com/voz/gravar; o código aparece no log)
      VOZ_CLONADA: "sim"
      NUM_FONTE: "https://raw.githubusercontent.com/wyterlin1-svg/Web/hostinger/index.html"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - murinoi_segredos:/segredos
    command:
      - sh
      - -c
      - |
        set -u
        NOME=murinoi-site
        IMG=caddy:2.8-alpine
        cat > /tmp/boot.sh <<'FIM'
        mkdir -p /srv/site
        atualizar() {
          rm -rf /tmp/novo && mkdir -p /tmp/novo
          if wget -qO /tmp/site.zip "$$SITE_ZIP" && unzip -qo /tmp/site.zip -d /tmp/novo; then
            pasta=$$(ls -d /tmp/novo/*/ | head -n1)
            if [ -f "$${pasta}index.html" ]; then
              rm -rf /srv/site/* /srv/site/.[!.]* 2>/dev/null || true
              cp -a "$${pasta}." /srv/site/
              echo "site atualizado: $$(date)"
            fi
          else
            echo "aviso: não consegui baixar o site agora; mantendo a versão atual"
          fi
        }
        atualizar
        cat > /etc/caddy/Caddyfile <<EOF
        $$SITE_ADDR {
          root * /srv/site
          encode zstd gzip
          @fontes path /fonts/*
          header @fontes Cache-Control "public, max-age=31536000, immutable"
          @estaticos path *.js *.css *.png *.jpg *.svg *.ico *.webmanifest
          header @estaticos Cache-Control "public, max-age=86400"
          @paginas path / *.html */
          header @paginas Cache-Control "no-cache"
          handle /voz/gravar* {
            reverse_proxy murinoi-clone:8090
          }
          handle /voz {
            reverse_proxy murinoi-voz:8080
          }
          file_server
          handle_errors {
            @404 expression {err.status_code} == 404
            rewrite @404 /404.html
            file_server
          }
        }
        EOF
        ( while true; do sleep 600; atualizar; done ) &
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
        FIM

        subir() {
          docker rm -f $$NOME >/dev/null 2>&1 || true
          docker pull -q $$IMG >/dev/null 2>&1 || true
          comum="-d --name $$NOME --restart unless-stopped -e SITE_ZIP=$$SITE_ZIP"
          T=$$(docker ps --format '{{.Names}} {{.Image}}' | grep -i traefik | awk '{print $$1}' | head -n1)
          # copia entrada e certificado de outro app que já funciona atrás do Traefik (ex.: n8n)
          rotulos=$$(docker ps -q | xargs -r docker inspect -f '{{range $$k, $$v := .Config.Labels}}{{$$k}}={{$$v}}{{"\n"}}{{end}}' 2>/dev/null | grep -v '\.murinoi\.')
          ep=$$(echo "$$rotulos" | sed -n 's/^traefik\.http\.routers\.[^.]*\.entrypoints=//p' | grep -vx web | head -n1)
          cr=$$(echo "$$rotulos" | sed -n 's/^traefik\.http\.routers\.[^.]*\.tls\.certresolver=//p' | head -n1)
          if [ -n "$$T" ]; then
            args=$$(docker inspect -f '{{join .Args " "}}' "$$T" | tr ' ' '\n')
            [ -z "$$ep" ] && ep=$$(echo "$$args" | sed -n 's/^--entrypoints\.\([^.=]*\)\.address=:443$$/\1/p' | head -n1)
            [ -z "$$cr" ] && cr=$$(echo "$$args" | sed -n 's/^--certificatesresolvers\.\([^.=]*\)\..*/\1/p' | head -n1)
          fi
          [ -z "$$ep" ] && ep=websecure
          [ -z "$$cr" ] && cr=letsencrypt  # padrão da Hostinger
          B='`'; regra=""
          for d in $$DOMINIOS; do regra="$${regra:+$$regra || }Host($$B$$d$$B)"; done
          set -- --label traefik.enable=true \
            --label "traefik.http.routers.murinoi.rule=$$regra" \
            --label "traefik.http.routers.murinoi.entrypoints=$$ep" \
            --label traefik.http.routers.murinoi.tls=true \
            --label traefik.http.services.murinoi.loadbalancer.server.port=80
          [ -n "$$cr" ] && set -- "$$@" --label "traefik.http.routers.murinoi.tls.certresolver=$$cr"

          if [ -n "$$T" ]; then
            rede=$$(docker inspect -f '{{range $$k, $$v := .NetworkSettings.Networks}}{{$$k}} {{end}}' "$$T" | awk '{print $$1}')
            echo "Traefik encontrado ($$T, rede $$rede, entrada $$ep, certificado $${cr:-padrão})"
            if [ "$$rede" = host ] || [ -z "$$rede" ]; then
              docker run $$comum "$$@" -e "SITE_ADDR=:80" $$IMG sh -c "$$(cat /tmp/boot.sh)"
            else
              docker run $$comum --network "$$rede" --label "traefik.docker.network=$$rede" "$$@" \
                -e "SITE_ADDR=:80" $$IMG sh -c "$$(cat /tmp/boot.sh)"
            fi
          else
            enderecos=$$(echo $$DOMINIOS | sed 's/ /, /g')
            if docker run $$comum -p 80:80 -p 443:443 -v murinoi_caddy_data:/data \
                -e "SITE_ADDR=$$enderecos" $$IMG sh -c "$$(cat /tmp/boot.sh)"; then
              echo "portas 80/443 livres: Caddy direto com HTTPS"
            else
              docker rm -f $$NOME >/dev/null 2>&1 || true
              echo "portas 80/443 ocupadas por outro programa: site na porta 8080 (http://IP-DA-VPS:8080)"
              docker run $$comum -p 8080:80 "$$@" -e "SITE_ADDR=:80" $$IMG sh -c "$$(cat /tmp/boot.sh)"
            fi
          fi
        }
        # ---------- chatbot do WhatsApp (Evolution API + n8n) ----------
        EVO=murinoi-evo
        EVO_IMG=evoapicloud/evolution-api:v2.3.7
        EVO_URL=http://murinoi-evo:8080
        rodando() { docker ps --format '{{.Names}}' | grep -qx "$$1"; }

        # ---------- voz da Nina (voz neural de mulher, servida pelo próprio site em /voz) ----------
        cat > /tmp/voz.py <<'PY'
        import asyncio, hashlib, os, re, time
        from aiohttp import web
        import aiohttp, edge_tts
        VOZ = os.environ.get('VOZ_NOME', 'pt-BR-ThalitaMultilingualNeural')
        CACHE = '/cache'; os.makedirs(CACHE, exist_ok=True)
        ORIGENS = re.compile(r'^https://(www\.)?murinoi\.com(/|$$)|^http://(localhost|127\.0\.0\.1)(:\d+)?(/|$$)')
        vistos = {}
        CLONE = 'http://murinoi-clone:8090'; _ver = [None, 0.0]
        async def versao_clone():
            if time.time() - _ver[1] < 20: return _ver[0]
            v = None
            try:
                async with aiohttp.ClientSession(timeout=aiohttp.ClientTimeout(total=2)) as s:
                    async with s.get(CLONE + '/versao') as r:
                        if r.status == 200: v = (await r.text()).strip() or None
            except Exception: pass
            _ver[0], _ver[1] = v, time.time(); return v
        async def clonar(t):
            try:
                async with aiohttp.ClientSession(timeout=aiohttp.ClientTimeout(total=240)) as s:
                    async with s.get(CLONE + '/sintetizar', params={'t': t}) as r:
                        if r.status == 200: return await r.read()
            except Exception: pass
            return None
        async def falar(req):
            t = re.sub(r'\s+', ' ', req.query.get('t', '')).strip()
            if not t or len(t) > 400: raise web.HTTPBadRequest()
            if not ORIGENS.match(req.headers.get('Referer', '')): raise web.HTTPForbidden()
            ip = req.headers.get('X-Forwarded-For', req.remote or '').split(',')[0].strip()
            agora = time.time(); h = [x for x in vistos.get(ip, []) if agora - x < 60]
            if len(h) >= 40: raise web.HTTPTooManyRequests()
            vistos[ip] = h + [agora]
            if len(vistos) > 5000: vistos.clear()
            v = await versao_clone()   # com a sua voz gravada, ela tem prioridade; se falhar, segue a Thalita
            if v:
                arq = os.path.join(CACHE, hashlib.sha1(('clone' + v + t).encode()).hexdigest() + '.wav')
                cw = {'Content-Type': 'audio/wav', 'Cache-Control': 'public, max-age=86400'}
                if os.path.exists(arq): return web.FileResponse(arq, headers=cw)
                dados = await clonar(t)
                if dados:
                    with open(arq + '.tmp', 'wb') as f: f.write(dados)
                    os.replace(arq + '.tmp', arq)
                    return web.Response(body=dados, headers=cw)
            arq = os.path.join(CACHE, hashlib.sha1((VOZ + t).encode()).hexdigest() + '.mp3')
            cab = {'Content-Type': 'audio/mpeg', 'Cache-Control': 'public, max-age=86400'}
            if os.path.exists(arq): return web.FileResponse(arq, headers=cab)
            r = web.StreamResponse(headers=cab); partes = []
            try:
                async for c in edge_tts.Communicate(t, VOZ, rate='+4%').stream():
                    if c['type'] != 'audio': continue
                    if not partes: await r.prepare(req)
                    partes.append(c['data']); await r.write(c['data'])
            except Exception:
                if not partes: raise web.HTTPBadGateway()
                return r
            if not partes: raise web.HTTPBadGateway()
            with open(arq + '.tmp', 'wb') as f: f.write(b''.join(partes))
            os.replace(arq + '.tmp', arq)
            fs = sorted(os.scandir(CACHE), key=lambda e: e.stat().st_mtime)
            for e in fs[:max(0, len(fs) - 3000)]: os.remove(e.path)
            await r.write_eof(); return r
        app = web.Application(); app.router.add_get('/voz', falar)
        web.run_app(app, port=8080, access_log=None)
        PY
        voz_subir() {
          docker network inspect murinoi-int >/dev/null 2>&1 || docker network create murinoi-int >/dev/null
          vh=$$(cat /tmp/voz.py | md5sum | cut -c1-12)-$$VOZ_NOME
          [ "$$(docker inspect -f '{{index .Config.Labels "murinoi.voz"}}' murinoi-voz 2>/dev/null)" = "$$vh" ] || docker rm -f murinoi-voz >/dev/null 2>&1 || true
          if ! rodando murinoi-voz; then
            docker rm -f murinoi-voz >/dev/null 2>&1 || true
            docker run -d --name murinoi-voz --restart unless-stopped --network murinoi-int --label "murinoi.voz=$$vh" \
              -e "VOZ_NOME=$$VOZ_NOME" -e "VOZ_PY=$$(cat /tmp/voz.py)" -v murinoi_voz_cache:/cache \
              python:3.12-alpine sh -c 'pip install -q --no-cache-dir edge-tts && exec python -c "$$VOZ_PY"' >/dev/null && echo "voz da Nina no ar ($$VOZ_NOME)"
          fi
          docker network connect murinoi-int $$NOME >/dev/null 2>&1 || true
        }

        # ---------- voz clonada da Nina (Chatterbox, roda na VPS, sem mensalidade) ----------
        cat > /tmp/clone.Dockerfile <<'DF'
        FROM python:3.11-slim
        RUN apt-get update && apt-get install -y --no-install-recommends ffmpeg git && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
        RUN pip install --no-cache-dir chatterbox-tts==0.1.7 aiohttp
        DF
        cat > /tmp/gravar.html <<'HTML'
        <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Gravar a voz da Nina</title>
        <style>body{margin:0;background:#f7f3ee;color:#2e2b33;font:17px/1.6 system-ui,-apple-system,sans-serif}main{max-width:620px;margin:0 auto;padding:32px 16px}h1{font-family:Georgia,serif;font-weight:400;font-size:2rem;margin:0 0 8px}p,li{color:#5b5662}.cartao{background:#fffdfa;border:1px solid #e4ddd6;border-radius:18px;padding:20px;margin:18px 0}.texto{font-size:1.15rem;color:#2e2b33;line-height:1.7}button{font:500 1rem system-ui;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;background:#2e2b33;color:#fff;margin:6px 8px 6px 0}button.sec{background:#fff;color:#2e2b33;border:1px solid #d9cfd6}button:disabled{opacity:.4}#tempo{font-variant-numeric:tabular-nums;color:#a7798a;font-weight:600}#status{margin-top:12px;font-weight:500}audio{width:100%;margin-top:12px}.rec{background:#b98393!important}</style></head><body><main>
        <h1>Gravar a voz da Nina</h1>
        <p>A Nina, assistente do site da Murinoi, vai falar com a sua voz. Grave de 15 a 25 segundos lendo o texto abaixo.</p>
        <ul><li>Lugar silencioso, sem TV, ventilador ou eco.</li><li>Celular a um palmo da boca.</li><li>Fale do seu jeito natural, calmo e simpático, como falaria com um cliente.</li></ul>
        <div class="cartao texto">Olá! Eu sou a Nina, da Murinoi. Aqui a gente transforma ideias em soluções que economizam tempo e dinheiro: aplicativos, sistemas, sites e automações com inteligência artificial. Me conta o que mais toma o seu tempo hoje, que eu te mostro como resolver. Vamos começar?</div>
        <div class="cartao"><label style="display:block;font-weight:500;margin-bottom:6px" for="nome">Seu nome completo</label><input id="nome" autocomplete="name" style="width:100%;box-sizing:border-box;font:inherit;padding:12px 14px;border:1px solid #d9cfd6;border-radius:12px;background:#fff"><label style="display:flex;gap:10px;align-items:flex-start;margin-top:14px;color:#2e2b33"><input type="checkbox" id="aceite" style="margin-top:5px;width:20px;height:20px;flex:none"><span id="termo">Eu, <b>[seu nome]</b>, sou a dona desta voz e autorizo a Murinoi a usá-la como voz da assistente Nina no site murinoi.com. Posso pedir a remoção quando quiser.</span></label></div>
        <div class="cartao"><button id="gravar">● Gravar</button><span id="tempo">0:00</span>
        <audio id="ouvir" controls hidden></audio>
        <div><button id="enviar" disabled>Usar esta gravação</button><button id="refazer" class="sec" hidden>Gravar de novo</button></div>
        <div id="status"></div></div>
        <p style="font-size:.85rem">Grave somente a sua própria voz. Você pode trocar a gravação quando quiser, voltando a esta página, ou remover a sua voz da Nina:</p><button id="remover" class="sec">Remover minha voz da Nina</button>
        </main><script>
        var nm = document.getElementById('nome'), ac = document.getElementById('aceite'), tm = document.getElementById('termo');
        function pode() { return !!blob && nm.value.trim().length >= 3 && ac.checked; }
        function atualiza() { var n = nm.value.trim(); tm.querySelector('b').textContent = n || '[seu nome]'; bE.disabled = !pode(); if (blob && /preencha/.test(st.textContent) && pode()) st.textContent = 'Tudo certo. Toque em "Usar esta gravação".'; }
        nm.oninput = atualiza; ac.onchange = atualiza;
        var rec = null, partes = [], blob = null, ini = 0, tick = 0, bG = document.getElementById('gravar'), bE = document.getElementById('enviar'), bR = document.getElementById('refazer'), au = document.getElementById('ouvir'), st = document.getElementById('status'), tp = document.getElementById('tempo');
        function parar() { if (rec && rec.state !== 'inactive') rec.stop(); clearInterval(tick); bG.textContent = '● Gravar'; bG.classList.remove('rec'); }
        bG.onclick = function () {
          if (rec && rec.state === 'recording') return parar();
          navigator.mediaDevices.getUserMedia({audio: {echoCancellation: false, noiseSuppression: true, autoGainControl: true}}).then(function (s) {
            partes = []; rec = new MediaRecorder(s);
            rec.ondataavailable = function (e) { if (e.data.size) partes.push(e.data); };
            rec.onstop = function () { s.getTracks().forEach(function (t) { t.stop(); }); blob = new Blob(partes, {type: rec.mimeType || 'audio/webm'}); au.src = URL.createObjectURL(blob); au.hidden = false; bR.hidden = false; atualiza(); st.textContent = pode() ? 'Ouça a gravação. Se ficou boa, toque em "Usar esta gravação".' : 'Ouça a gravação. Para usar, preencha o seu nome e marque a autorização acima.'; };
            rec.start(); ini = Date.now(); bG.textContent = '■ Parar'; bG.classList.add('rec'); st.textContent = 'Gravando… leia o texto com calma.';
            tick = setInterval(function () { var s2 = Math.floor((Date.now() - ini) / 1000); tp.textContent = Math.floor(s2 / 60) + ':' + String(s2 % 60).padStart(2, '0'); if (s2 >= 40) parar(); }, 250);
          }).catch(function () { st.textContent = 'Não consegui acessar o microfone. Permita o microfone para este site e tente de novo.'; });
        };
        bR.onclick = function () { blob = null; au.hidden = true; bE.disabled = true; bR.hidden = true; tp.textContent = '0:00'; st.textContent = ''; };
        bE.onclick = function () {
          if (!pode()) return; bE.disabled = true;
          var fd = new FormData(); fd.append('nome', nm.value.trim()); fd.append('aceite', 'sim'); fd.append('audio', blob, 'gravacao'); st.textContent = 'Enviando e preparando a sua voz… isso pode levar alguns minutos, não feche a página.';
          fetch(location.href, {method: 'POST', body: fd}).then(function (r) { return r.ok ? r.json() : r.text().then(function (t) { throw t; }); })
            .then(function () { st.textContent = 'Pronto! A Nina já está falando com a sua voz. 🎉'; })
            .catch(function (e) { st.textContent = 'Não deu certo: ' + (e || 'tente de novo') + '.'; atualiza(); });
        };
        document.getElementById('remover').onclick = function () {
          if (!confirm('Remover a sua voz da Nina? Ela volta a falar com a voz padrão.')) return;
          fetch(location.href.replace('/voz/gravar', '/voz/remover'), {method: 'POST'}).then(function (r) { st.textContent = r.ok ? 'Sua voz foi removida. A Nina voltou para a voz padrão.' : 'Não consegui remover agora, tente de novo.'; });
        };
        </script></body></html>
        HTML
        cat > /tmp/clone.py <<'PY'
        import asyncio, datetime, hashlib, io, json, os, subprocess, time
        from aiohttp import web
        import torch, soundfile as sf
        from chatterbox.mtl_tts import ChatterboxMultilingualTTS
        torch.set_num_threads(max(1, os.cpu_count() or 1))
        COD = os.environ['CODIGO']; DADOS = os.environ.get('DADOS', '/dados')
        REF = DADOS + '/referencia.wav'; TERMO = DADOS + '/consentimento.json'
        est = {'modelo': None, 'versao': None, 'pronto': False}
        trava = asyncio.Lock(); andamento = {}
        def log(*a): print(*a, flush=True)
        def preparar():
            if est['modelo'] is None:
                log('voz clonada: carregando o modelo (a primeira vez baixa uns 3 GB)...')
                est['modelo'] = ChatterboxMultilingualTTS.from_pretrained(device='cpu', t3_model='v3')
            if os.path.exists(REF) and os.path.exists(TERMO):   # só usa a voz com a autorização registrada
                est['modelo'].prepare_conditionals(REF)
                est['versao'] = hashlib.sha1(open(REF, 'rb').read()).hexdigest()[:12]
                try: c = json.load(open(TERMO)); log('voz clonada ativa: gravada e autorizada por %s em %s' % (c.get('nome'), c.get('data')))
                except Exception: pass
                t0 = time.time(); w = gerar('Olá! Eu sou a Nina, da Murinoi.')
                log('voz clonada pronta: frase curta gerada em %.1f s' % (time.time() - t0))
            else:
                est['versao'] = None; log('voz clonada: aguardando a gravação (com autorização) da voz')
            est['pronto'] = True
        def gerar(t):
            w = est['modelo'].generate(t, language_id='pt')
            b = io.BytesIO(); sf.write(b, w.squeeze(0).cpu().numpy(), est['modelo'].sr, format='WAV', subtype='PCM_16')
            return b.getvalue()
        async def versao(req):
            if not est['pronto'] or not est['versao']: raise web.HTTPNotFound()
            return web.Response(text=est['versao'])
        async def sintetizar(req):
            t = ' '.join(req.query.get('t', '').split())
            if not t or len(t) > 400: raise web.HTTPBadRequest()
            if not est['pronto'] or not est['versao']: raise web.HTTPNotFound()
            if t not in andamento:
                async def tarefa():
                    async with trava:
                        return await asyncio.get_running_loop().run_in_executor(None, gerar, t)
                andamento[t] = asyncio.ensure_future(tarefa())
            try: dados = await asyncio.shield(andamento[t])
            finally:
                if andamento.get(t) is not None and andamento[t].done(): andamento.pop(t, None)
            return web.Response(body=dados, content_type='audio/wav')
        async def pagina(req):
            if req.query.get('c') != COD: raise web.HTTPForbidden()
            return web.Response(text=os.environ.get('GRAVAR_HTML', ''), content_type='text/html')
        async def receber(req):
            if req.query.get('c') != COD: raise web.HTTPForbidden()
            form = await req.post()
            nome = ' '.join(str(form.get('nome', '')).split())[:120]
            audio = form.get('audio')
            if len(nome) < 3: raise web.HTTPBadRequest(text='informe o seu nome completo')
            if form.get('aceite') != 'sim': raise web.HTTPBadRequest(text='é preciso autorizar o uso da voz')
            if audio is None or not hasattr(audio, 'file'): raise web.HTTPBadRequest(text='gravação vazia')
            corpo = audio.file.read()
            if len(corpo) < 2000: raise web.HTTPBadRequest(text='gravação vazia')
            os.makedirs(DADOS, exist_ok=True)
            with open(DADOS + '/entrada', 'wb') as f: f.write(corpo)
            r = subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-i', DADOS + '/entrada', '-ac', '1', '-ar', '24000',
                                '-af', 'silenceremove=start_periods=1:start_threshold=-45dB,loudnorm', '-t', '20', DADOS + '/nova.wav'])
            os.remove(DADOS + '/entrada')
            if r.returncode != 0: raise web.HTTPBadRequest(text='não consegui ler o áudio')
            termo = {'nome': nome, 'data': datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds'),
                     'texto': 'Eu, ' + nome + ', sou a dona desta voz e autorizo a Murinoi a usá-la como voz da assistente Nina no site murinoi.com. Posso pedir a remoção quando quiser.',
                     'gravacao_sha256': hashlib.sha256(open(DADOS + '/nova.wav', 'rb').read()).hexdigest(),
                     'ip': req.headers.get('X-Forwarded-For', req.remote or '').split(',')[0].strip()}
            with open(TERMO + '.tmp', 'w') as f: json.dump(termo, f, ensure_ascii=False, indent=1)
            os.replace(TERMO + '.tmp', TERMO); os.replace(DADOS + '/nova.wav', REF)
            async with trava:
                await asyncio.get_running_loop().run_in_executor(None, preparar)
            return web.json_response({'ok': True, 'versao': est['versao']})
        async def remover(req):
            if req.query.get('c') != COD: raise web.HTTPForbidden()
            for f in (REF, TERMO):
                if os.path.exists(f): os.remove(f)
            est['versao'] = None; log('voz clonada removida a pedido; a Nina volta para a voz padrão')
            return web.json_response({'ok': True})
        async def iniciar(app):
            asyncio.get_running_loop().run_in_executor(None, preparar)
        app = web.Application(client_max_size=25 * 1024 * 1024)
        app.router.add_get('/versao', versao); app.router.add_get('/sintetizar', sintetizar)
        app.router.add_get('/voz/gravar', pagina); app.router.add_post('/voz/gravar', receber); app.router.add_post('/voz/remover', remover)
        app.on_startup.append(iniciar)
        web.run_app(app, port=8090, access_log=None)
        PY
        clone_subir() {
          [ "$$VOZ_CLONADA" = sim ] || return 0
          mem=$$(awk '/MemTotal/{print int($$2/1024)}' /proc/meminfo)
          if [ "$$mem" -lt 5500 ]; then echo "voz clonada: a VPS tem $${mem} MB de memória e precisa de uns 6 GB; a Nina segue com a voz $$VOZ_NOME"; return 0; fi
          mkdir -p /segredos; [ -s /segredos/voz_codigo ] || head -c 9 /dev/urandom | od -An -tx1 | tr -d ' \n' > /segredos/voz_codigo
          COD=$$(cat /segredos/voz_codigo)
          df=$$(md5sum < /tmp/clone.Dockerfile | cut -c1-12)
          if [ "$$(docker image inspect -f '{{index .Config.Labels "murinoi.df"}}' murinoi-clone-img 2>/dev/null)" != "$$df" ]; then
            echo "voz clonada: preparando o programa (a primeira vez leva de 10 a 20 minutos)..."
            docker build -q --label "murinoi.df=$$df" -t murinoi-clone-img - < /tmp/clone.Dockerfile >/dev/null || { echo "aviso: não consegui preparar a voz clonada"; return 1; }
          fi
          ch=$$(cat /tmp/clone.py /tmp/gravar.html | md5sum | cut -c1-12)
          [ "$$(docker inspect -f '{{index .Config.Labels "murinoi.clone"}}' murinoi-clone 2>/dev/null)" = "$$ch" ] || docker rm -f murinoi-clone >/dev/null 2>&1 || true
          if ! rodando murinoi-clone; then
            docker run -d --name murinoi-clone --restart unless-stopped --network murinoi-int --label "murinoi.clone=$$ch" \
              -e "CODIGO=$$COD" -e "CLONE_PY=$$(cat /tmp/clone.py)" -e "GRAVAR_HTML=$$(cat /tmp/gravar.html)" \
              -v murinoi_clone_dados:/dados -v murinoi_clone_hf:/root/.cache/huggingface \
              murinoi-clone-img sh -c 'exec python -c "$$CLONE_PY"' >/dev/null && echo "voz clonada: serviço no ar (acompanhe o log do contêiner murinoi-clone)"
          fi
          echo "=============================================="
          echo " VOZ CLONADA DA NINA: envie este link para a pessoa dona da voz"
          echo " (ela grava, informa o nome e autoriza o uso):"
          echo " https://murinoi.com/voz/gravar?c=$$COD"
          echo "=============================================="
        }

        api() { curl -s -m 30 -X "$$1" -H "apikey: $$KEY" -H 'Content-Type: application/json' "$$EVO_URL$$2" $${3:+-d "$$3"}; }

        evo_subir() {
          [ "$$EVOLUTION" = sim ] || return 0
          command -v curl >/dev/null || apk add --no-cache -q curl >/dev/null
          mkdir -p /segredos
          [ -s /segredos/evo_key ] || head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /segredos/evo_key
          [ -s /segredos/db_pass ] || head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /segredos/db_pass
          KEY=$$(cat /segredos/evo_key); PW=$$(cat /segredos/db_pass)
          docker network inspect $$EVO >/dev/null 2>&1 || docker network create $$EVO >/dev/null
          docker network connect $$EVO murinoi-instalador >/dev/null 2>&1 || true
          if ! rodando $$EVO-db; then
            docker rm -f $$EVO-db >/dev/null 2>&1 || true
            docker run -d --name $$EVO-db --restart unless-stopped --network $$EVO \
              -e POSTGRES_USER=evo -e "POSTGRES_PASSWORD=$$PW" -e POSTGRES_DB=evolution \
              -v murinoi_evo_db:/var/lib/postgresql/data postgres:16-alpine >/dev/null
          fi
          # só a rota de envio de mensagem fica pública (atrás do Traefik, protegida pela chave)
          set -- --label murinoi.versao=2
          if [ -n "$${T:-}" ]; then
            B='`'
            set -- "$$@" --label traefik.enable=true \
              --label "traefik.http.routers.murinoi-wa.rule=Host($${B}murinoi.com$${B}) && PathPrefix($${B}/wa-api/message/sendText/$${B})" \
              --label "traefik.http.routers.murinoi-wa.entrypoints=$$ep" \
              --label traefik.http.routers.murinoi-wa.tls=true \
              --label "traefik.http.routers.murinoi-wa.tls.certresolver=$$cr" \
              --label traefik.http.routers.murinoi-wa.middlewares=murinoi-wa-strip \
              --label traefik.http.middlewares.murinoi-wa-strip.stripprefix.prefixes=/wa-api \
              --label traefik.http.services.murinoi-wa.loadbalancer.server.port=8080
            if [ -n "$${rede:-}" ] && [ "$$rede" != host ]; then set -- "$$@" --label "traefik.docker.network=$$rede"; else set -- "$$@" --label "traefik.docker.network=$$EVO"; fi
          fi
          [ "$$(docker inspect -f '{{index .Config.Labels "murinoi.versao"}}' $$EVO 2>/dev/null)" = 2 ] || docker rm -f $$EVO >/dev/null 2>&1 || true
          if ! rodando $$EVO; then
            docker rm -f $$EVO >/dev/null 2>&1 || true
            docker run -d --name $$EVO --restart unless-stopped --network $$EVO "$$@" \
              -v murinoi_evo_inst:/evolution/instances \
              -e SERVER_URL=$$EVO_URL -e "AUTHENTICATION_API_KEY=$$KEY" -e AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=false \
              -e DATABASE_PROVIDER=postgresql -e DATABASE_CONNECTION_CLIENT_NAME=murinoi \
              -e "DATABASE_CONNECTION_URI=postgresql://evo:$$PW@$$EVO-db:5432/evolution?schema=evolution_api" \
              -e DATABASE_SAVE_DATA_HISTORIC=false -e DATABASE_SAVE_DATA_LABELS=false \
              -e CACHE_REDIS_ENABLED=false -e CACHE_LOCAL_ENABLED=true \
              -e N8N_ENABLED=true -e DEL_INSTANCE=false -e LANGUAGE=pt-BR -e LOG_LEVEL=ERROR,WARN \
              -e CONFIG_SESSION_PHONE_CLIENT=Murinoi -e CONFIG_SESSION_PHONE_NAME=Chrome \
              $$EVO_IMG >/dev/null
            [ -n "$${rede:-}" ] && [ "$$rede" != host ] && docker network connect "$$rede" $$EVO >/dev/null 2>&1 || true
          fi
          i=0; until api GET / | grep -q . ; do i=$$((i+1)); [ $$i -gt 60 ] && { echo "aviso: a Evolution API não respondeu"; return 1; }; sleep 3; done
          api GET "/instance/fetchInstances?instanceName=murinoi" | grep -q '"murinoi"' || \
            api POST /instance/create '{"instanceName":"murinoi","integration":"WHATSAPP-BAILEYS","qrcode":false}' >/dev/null
          bot=$$(cat <<JSON
        {"enabled":true,"description":"Atendente Murinoi","webhookUrl":"$$N8N_WEBHOOK","triggerType":"keyword","triggerOperator":"contains","triggerValue":"$$BOT_GATILHO","expire":120,"keywordFinish":"#sair","delayMessage":1200,"unknownMessage":"","listeningFromMe":false,"stopBotFromMe":true,"keepOpen":false,"debounceTime":6,"splitMessages":true,"timePerChar":35}
        JSON
        )
          atual=$$(api GET /n8n/find/murinoi)
          id=$$(echo "$$atual" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -n1)
          if [ -z "$$id" ]; then api POST /n8n/create/murinoi "$$bot" >/dev/null; echo "chatbot criado"
          else api PUT "/n8n/update/$$id/murinoi" "$$bot" >/dev/null; echo "chatbot atualizado"; fi
          echo "Evolution API no ar (só o envio de mensagens fica em https://murinoi.com/wa-api, protegido por chave)"
          echo "=============================================="
          echo " AVISO NO WHATSAPP: no n8n, crie a credencial 'Evolution Murinoi'"
          echo " (tipo Header Auth)  Nome: apikey   Valor: $$KEY"
          echo "=============================================="
        }

        # número decodificado do site na hora, sem ficar escrito em lugar nenhum
        numero() {
          k=$$(curl -s -m 20 "$$NUM_FONTE" | sed -n "s/.*const WA_K = '\([^']*\)'.*/\1/p" | head -n1)
          echo "$$k" | base64 -d 2>/dev/null | od -An -tu1 | tr -s ' ' '\n' | grep . | awk 'function x(a, b,  r, p) { r = 0; p = 1; while (a || b) { if ((a % 2) != (b % 2)) r += p; a = int(a / 2); b = int(b / 2); p *= 2 } return r } {s = sprintf("%c", x($$1, 23)) s} END {printf "%s", s}'
        }

        ultimo_codigo=0
        evo_conferir() {
          [ "$$EVOLUTION" = sim ] || return 0
          rodando $$EVO && rodando $$EVO-db || { evo_subir || return 0; }
          estado=$$(api GET /instance/connectionState/murinoi | sed -n 's/.*"state":"\([^"]*\)".*/\1/p')
          [ "$$estado" = open ] && { [ "$$ultimo_codigo" != ok ] && echo "WhatsApp conectado: o chatbot está atendendo"; ultimo_codigo=ok; return 0; }
          agora=$$(date +%s)
          [ "$$ultimo_codigo" != ok ] && [ $$((agora - ultimo_codigo)) -lt 170 ] && return 0
          cod=$$(api GET "/instance/connect/murinoi?number=$$(numero)" | sed -n 's/.*"pairingCode":"\([^"]*\)".*/\1/p')
          ultimo_codigo=$$agora
          [ -z "$$cod" ] && { echo "aguardando a Evolution gerar o código de conexão..."; return 0; }
          echo "=============================================="
          echo " CONECTE O WHATSAPP AO CHATBOT"
          echo " No celular: WhatsApp > Configurações > Dispositivos conectados"
          echo " > Conectar dispositivo > Conectar com número de telefone"
          echo " Digite o código:  $$cod"
          echo " (vale por poucos minutos; um novo aparece aqui se expirar)"
          echo "=============================================="
        }

        subir
        voz_subir || true
        clone_subir || true
        evo_subir || true
        # a cada minuto: chatbot conectado? a cada hora: site de pé?
        n=0
        while true; do
          evo_conferir || true
          sleep 60; n=$$((n+1))
          [ $$((n % 60)) -eq 0 ] && { docker ps --filter name=^/$$NOME$$ --format '{{.Names}}' | grep -q . || { subir; voz_subir || true; clone_subir || true; }; }
        done

