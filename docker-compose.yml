# Site Murinoi — cole a URL deste arquivo no Docker Manager da Hostinger.
# Funciona sozinho nos dois casos:
#  - VPS já tem Traefik (ex.: n8n) -> o site entra atrás dele e copia a configuração de HTTPS dos outros apps.
#  - Portas livres -> o site usa 80/443 direto e o Caddy emite o HTTPS.
#  - Porta 80 ocupada por outro programa -> o site sobe na porta 8080 (veja o log).
# O site é baixado do GitHub (ramo "hostinger") e se atualiza a cada 10 minutos.
# Chatbot do WhatsApp: Evolution API (só na rede interna) + n8n com IA. O código de conexão aparece no log.
# Antes: registros A de murinoi.com e www no DNS apontando para o IP da VPS.
services:
  instalador:
    image: docker:27-cli
    container_name: murinoi-instalador
    restart: unless-stopped
    environment:
      DOMINIOS: "murinoi.com www.murinoi.com"
      SITE_ZIP: "https://github.com/wyterlin1-svg/Web/archive/refs/heads/hostinger.zip"
      # chatbot do WhatsApp: Evolution API conversa, o n8n (IA) responde
      EVOLUTION: "sim"
      N8N_WEBHOOK: "https://murinoi.app.n8n.cloud/webhook/murinoi-bot-k7q2x9"
      BOT_GATILHO: "pelo site"
      NUM_FONTE: "https://raw.githubusercontent.com/wyterlin1-svg/Web/hostinger/index.html"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - murinoi_segredos:/segredos
    command:
      - sh
      - -c
      - |
        set -u
        NOME=murinoi-site
        IMG=caddy:2.8-alpine
        cat > /tmp/boot.sh <<'FIM'
        mkdir -p /srv/site
        atualizar() {
          rm -rf /tmp/novo && mkdir -p /tmp/novo
          if wget -qO /tmp/site.zip "$$SITE_ZIP" && unzip -qo /tmp/site.zip -d /tmp/novo; then
            pasta=$$(ls -d /tmp/novo/*/ | head -n1)
            if [ -f "$${pasta}index.html" ]; then
              rm -rf /srv/site/* /srv/site/.[!.]* 2>/dev/null || true
              cp -a "$${pasta}." /srv/site/
              echo "site atualizado: $$(date)"
            fi
          else
            echo "aviso: não consegui baixar o site agora; mantendo a versão atual"
          fi
        }
        atualizar
        cat > /etc/caddy/Caddyfile <<EOF
        $$SITE_ADDR {
          root * /srv/site
          encode zstd gzip
          @estaticos path *.js *.css *.png *.jpg *.svg *.ico *.webmanifest
          header @estaticos Cache-Control "public, max-age=86400"
          file_server
          handle_errors {
            @404 expression {err.status_code} == 404
            rewrite @404 /404.html
            file_server
          }
        }
        EOF
        ( while true; do sleep 600; atualizar; done ) &
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
        FIM

        subir() {
          docker rm -f $$NOME >/dev/null 2>&1 || true
          docker pull -q $$IMG >/dev/null 2>&1 || true
          comum="-d --name $$NOME --restart unless-stopped -e SITE_ZIP=$$SITE_ZIP"
          T=$$(docker ps --format '{{.Names}} {{.Image}}' | grep -i traefik | awk '{print $$1}' | head -n1)
          # copia entrada e certificado de outro app que já funciona atrás do Traefik (ex.: n8n)
          rotulos=$$(docker ps -q | xargs -r docker inspect -f '{{range $$k, $$v := .Config.Labels}}{{$$k}}={{$$v}}{{"\n"}}{{end}}' 2>/dev/null | grep -v '\.murinoi\.')
          ep=$$(echo "$$rotulos" | sed -n 's/^traefik\.http\.routers\.[^.]*\.entrypoints=//p' | grep -vx web | head -n1)
          cr=$$(echo "$$rotulos" | sed -n 's/^traefik\.http\.routers\.[^.]*\.tls\.certresolver=//p' | head -n1)
          if [ -n "$$T" ]; then
            args=$$(docker inspect -f '{{join .Args " "}}' "$$T" | tr ' ' '\n')
            [ -z "$$ep" ] && ep=$$(echo "$$args" | sed -n 's/^--entrypoints\.\([^.=]*\)\.address=:443$$/\1/p' | head -n1)
            [ -z "$$cr" ] && cr=$$(echo "$$args" | sed -n 's/^--certificatesresolvers\.\([^.=]*\)\..*/\1/p' | head -n1)
          fi
          [ -z "$$ep" ] && ep=websecure
          [ -z "$$cr" ] && cr=letsencrypt  # padrão da Hostinger
          B='`'; regra=""
          for d in $$DOMINIOS; do regra="$${regra:+$$regra || }Host($$B$$d$$B)"; done
          set -- --label traefik.enable=true \
            --label "traefik.http.routers.murinoi.rule=$$regra" \
            --label "traefik.http.routers.murinoi.entrypoints=$$ep" \
            --label traefik.http.routers.murinoi.tls=true \
            --label traefik.http.services.murinoi.loadbalancer.server.port=80
          [ -n "$$cr" ] && set -- "$$@" --label "traefik.http.routers.murinoi.tls.certresolver=$$cr"

          if [ -n "$$T" ]; then
            rede=$$(docker inspect -f '{{range $$k, $$v := .NetworkSettings.Networks}}{{$$k}} {{end}}' "$$T" | awk '{print $$1}')
            echo "Traefik encontrado ($$T, rede $$rede, entrada $$ep, certificado $${cr:-padrão})"
            if [ "$$rede" = host ] || [ -z "$$rede" ]; then
              docker run $$comum "$$@" -e "SITE_ADDR=:80" $$IMG sh -c "$$(cat /tmp/boot.sh)"
            else
              docker run $$comum --network "$$rede" --label "traefik.docker.network=$$rede" "$$@" \
                -e "SITE_ADDR=:80" $$IMG sh -c "$$(cat /tmp/boot.sh)"
            fi
          else
            enderecos=$$(echo $$DOMINIOS | sed 's/ /, /g')
            if docker run $$comum -p 80:80 -p 443:443 -v murinoi_caddy_data:/data \
                -e "SITE_ADDR=$$enderecos" $$IMG sh -c "$$(cat /tmp/boot.sh)"; then
              echo "portas 80/443 livres: Caddy direto com HTTPS"
            else
              docker rm -f $$NOME >/dev/null 2>&1 || true
              echo "portas 80/443 ocupadas por outro programa: site na porta 8080 (http://IP-DA-VPS:8080)"
              docker run $$comum -p 8080:80 "$$@" -e "SITE_ADDR=:80" $$IMG sh -c "$$(cat /tmp/boot.sh)"
            fi
          fi
        }
        # ---------- chatbot do WhatsApp (Evolution API + n8n) ----------
        EVO=murinoi-evo
        EVO_IMG=evoapicloud/evolution-api:v2.3.7
        EVO_URL=http://murinoi-evo:8080
        rodando() { docker ps --format '{{.Names}}' | grep -qx "$$1"; }
        api() { curl -s -m 30 -X "$$1" -H "apikey: $$KEY" -H 'Content-Type: application/json' "$$EVO_URL$$2" $${3:+-d "$$3"}; }

        evo_subir() {
          [ "$$EVOLUTION" = sim ] || return 0
          command -v curl >/dev/null || apk add --no-cache -q curl >/dev/null
          mkdir -p /segredos
          [ -s /segredos/evo_key ] || head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /segredos/evo_key
          [ -s /segredos/db_pass ] || head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \n' > /segredos/db_pass
          KEY=$$(cat /segredos/evo_key); PW=$$(cat /segredos/db_pass)
          docker network inspect $$EVO >/dev/null 2>&1 || docker network create $$EVO >/dev/null
          docker network connect $$EVO murinoi-instalador >/dev/null 2>&1 || true
          if ! rodando $$EVO-db; then
            docker rm -f $$EVO-db >/dev/null 2>&1 || true
            docker run -d --name $$EVO-db --restart unless-stopped --network $$EVO \
              -e POSTGRES_USER=evo -e "POSTGRES_PASSWORD=$$PW" -e POSTGRES_DB=evolution \
              -v murinoi_evo_db:/var/lib/postgresql/data postgres:16-alpine >/dev/null
          fi
          if ! rodando $$EVO; then
            docker rm -f $$EVO >/dev/null 2>&1 || true
            docker run -d --name $$EVO --restart unless-stopped --network $$EVO \
              -v murinoi_evo_inst:/evolution/instances \
              -e SERVER_URL=$$EVO_URL -e "AUTHENTICATION_API_KEY=$$KEY" -e AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=false \
              -e DATABASE_PROVIDER=postgresql -e DATABASE_CONNECTION_CLIENT_NAME=murinoi \
              -e "DATABASE_CONNECTION_URI=postgresql://evo:$$PW@$$EVO-db:5432/evolution?schema=evolution_api" \
              -e DATABASE_SAVE_DATA_HISTORIC=false -e DATABASE_SAVE_DATA_LABELS=false \
              -e CACHE_REDIS_ENABLED=false -e CACHE_LOCAL_ENABLED=true \
              -e N8N_ENABLED=true -e DEL_INSTANCE=false -e LANGUAGE=pt-BR -e LOG_LEVEL=ERROR,WARN \
              -e CONFIG_SESSION_PHONE_CLIENT=Murinoi -e CONFIG_SESSION_PHONE_NAME=Chrome \
              $$EVO_IMG >/dev/null
          fi
          i=0; until api GET / | grep -q . ; do i=$$((i+1)); [ $$i -gt 60 ] && { echo "aviso: a Evolution API não respondeu"; return 1; }; sleep 3; done
          api GET "/instance/fetchInstances?instanceName=murinoi" | grep -q '"murinoi"' || \
            api POST /instance/create '{"instanceName":"murinoi","integration":"WHATSAPP-BAILEYS","qrcode":false}' >/dev/null
          bot=$$(cat <<JSON
        {"enabled":true,"description":"Atendente Murinoi","webhookUrl":"$$N8N_WEBHOOK","triggerType":"keyword","triggerOperator":"contains","triggerValue":"$$BOT_GATILHO","expire":120,"keywordFinish":"#sair","delayMessage":1200,"unknownMessage":"","listeningFromMe":false,"stopBotFromMe":true,"keepOpen":false,"debounceTime":6,"splitMessages":true,"timePerChar":35}
        JSON
        )
          atual=$$(api GET /n8n/find/murinoi)
          id=$$(echo "$$atual" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -n1)
          if [ -z "$$id" ]; then api POST /n8n/create/murinoi "$$bot" >/dev/null; echo "chatbot criado"
          else api PUT "/n8n/update/$$id/murinoi" "$$bot" >/dev/null; echo "chatbot atualizado"; fi
          echo "Evolution API no ar (rede interna, sem porta aberta)"
        }

        # número decodificado do site na hora, sem ficar escrito em lugar nenhum
        numero() {
          k=$$(curl -s -m 20 "$$NUM_FONTE" | sed -n "s/.*const WA_K = '\([^']*\)'.*/\1/p" | head -n1)
          echo "$$k" | base64 -d 2>/dev/null | od -An -tu1 | tr -s ' ' '\n' | grep . | awk 'function x(a, b,  r, p) { r = 0; p = 1; while (a || b) { if ((a % 2) != (b % 2)) r += p; a = int(a / 2); b = int(b / 2); p *= 2 } return r } {s = sprintf("%c", x($$1, 23)) s} END {printf "%s", s}'
        }

        ultimo_codigo=0
        evo_conferir() {
          [ "$$EVOLUTION" = sim ] || return 0
          rodando $$EVO && rodando $$EVO-db || { evo_subir || return 0; }
          estado=$$(api GET /instance/connectionState/murinoi | sed -n 's/.*"state":"\([^"]*\)".*/\1/p')
          [ "$$estado" = open ] && { [ "$$ultimo_codigo" != ok ] && echo "WhatsApp conectado: o chatbot está atendendo"; ultimo_codigo=ok; return 0; }
          agora=$$(date +%s)
          [ "$$ultimo_codigo" != ok ] && [ $$((agora - ultimo_codigo)) -lt 170 ] && return 0
          cod=$$(api GET "/instance/connect/murinoi?number=$$(numero)" | sed -n 's/.*"pairingCode":"\([^"]*\)".*/\1/p')
          ultimo_codigo=$$agora
          [ -z "$$cod" ] && { echo "aguardando a Evolution gerar o código de conexão..."; return 0; }
          echo "=============================================="
          echo " CONECTE O WHATSAPP AO CHATBOT"
          echo " No celular: WhatsApp > Configurações > Dispositivos conectados"
          echo " > Conectar dispositivo > Conectar com número de telefone"
          echo " Digite o código:  $$cod"
          echo " (vale por poucos minutos; um novo aparece aqui se expirar)"
          echo "=============================================="
        }

        subir
        evo_subir || true
        # a cada minuto: chatbot conectado? a cada hora: site de pé?
        n=0
        while true; do
          evo_conferir || true
          sleep 60; n=$$((n+1))
          [ $$((n % 60)) -eq 0 ] && { docker ps --filter name=^/$$NOME$$ --format '{{.Names}}' | grep -q . || subir; }
        done

volumes:
  murinoi_segredos:
